version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sih_postgres
    environment:
      - POSTGRES_USER=parag
      - POSTGRES_PASSWORD=parag
      - POSTGRES_DB=sih_db
      - POSTGRES_HOST_AUTH_METHOD=trust
    ports:
      - "5433:5432"
    volumes:
      # This mounts your exported live database so Docker initializes it automatically
      - ./docker_init:/docker-entrypoint-initdb.d
      # This creates a permanent storage location in your project folder
      - ./pgdata:/var/lib/postgresql/data
    restart: unless-stopped
